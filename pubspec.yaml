name: divine_craving_project
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  url_launcher: ^6.2.6
  image_picker: ^1.2.0

  # Firebase Dependencies
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/images/divine_craving_logo.png"

  adaptive_icon_background: "#FFF8F2"
  adaptive_icon_foreground: "assets/images/divine_craving_logo.png"